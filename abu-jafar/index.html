body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:18px;line-height:1.9}

main .wrap{padding-block:18px 48px;display:grid;gap:14px}

.q.right{border-inline-start-color:var(--ok)}.q.wrong{border-inline-start-color:var(--bad)}
.qh{display:flex;gap:10px;align-items:flex-start}

.opt:hover:not(:disabled){border-color:var(--green2)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--okT);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.picked-wrong{background:var(--badT);border-color:var(--bad);color:var(--bad)}
.tf .opt{text-align:center;font-family:var(--f-ui);font-weight:600}
.fb{display:none;background:var(--goldT);border-radius:10px;padding:10px 14px;font-size:17px}
.q.done .fb{display:block}

.fb .ok{color:var(--ok)}.fb .no{color:var(--bad)}
.reveal{justify-self:start;font-family:var(--f-ui);font-size:15px;font-weight:600;border:1px solid var(--green);color:var(--green);background:var(--surface);border-radius:10px;padding:8px 16px;min-height:44px}
.ans{display:none;background:var(--goldT);border-radius:10px;padding:12px 14px;font-size:17.5px}
.q.open .ans{display:block}.q.open .reveal{display:none}
.ans p{margin:0 0 4px}
footer{border-top:1px solid var(--line)}footer .wrap{padding-block:16px 26px;font-family:var(--f-ui);font-size:13px;color:var(--muted)}

<script>
const SETS={"qal":{"title":"أسئلة أصول رواية قالون","sub":"من طريقي الشاطبية والطيبة","lede":"رواية قالون عن نافع: صح وخطأ، واختيار من متعدد، وأسئلة مقالية مع الإجابات.","foot":"المادة مأخوذة من عرض «أصول رواية الإمام قالون من طريقي الشاطبية والطيبة» إعداد الشيخ أبي عبد الرحمن ميسرة بن يوسف حجو، وصيغت أسئلتها دون ذكر الشواهد.","TF":[["الإمام قالون هو عيسى بن مينا المدني الزرقي، ويكنى أبا موسى.",true,"هو عيسى بن مينا المدني الزرقي مولى الزهريين، معلم العربية، ويكنى أبا موسى.","الترجمة"],["«قالون» اسم الإمام الحقيقي، وليس لقبًا.",false,"قالون لقب له، ويروى أن نافعًا لقبه به لجودة قراءته، وقالون بلسان الروم: جيد.","الترجمة"],["وُلد قالون سنة مئة في أيام عبد الملك بن مروان.",false,"ولد سنة ١٢٠هـ في أيام هشام بن عبد الملك.","الترجمة"],["تصدر قالون للإقراء بعد وفاة شيخه نافع.",false,"تصدر للإقراء وشيخه نافع حي.","الترجمة"],["كان قالون أصم لا يسمع البوق، فإذا قرأ عليه قارئ سمعه.",true,"هذا مما ذُكر في ترجمته.","الترجمة"],["كان لقالون عناية بالحديث، فأخرج له أبو عوانة في مستخرجه والطبراني في معجمه.",true,"وأخرج له كذلك ابن المقرئ في معجمه وغيرهم.","الترجمة"],["توفي قالون بمكة قريبًا من سنة عشرين ومئتين.",false,"توفي بالمدينة لا بمكة، قريبًا من سنة ٢٢٠هـ في أيام المأمون.","الترجمة"],["أخذ قالون عن نافع قراءته وقراءة أبي جعفر، وعرض أيضًا على عيسى بن وردان.",true,"أخذ القراءة عرضًا عن نافع: قراءةَ نافع وقراءةَ أبي جعفر، وعرض على عيسى بن وردان.","الترجمة"],["طريق قالون في الشاطبية هو طريق أحمد بن يزيد الحلواني.",false,"طريق الشاطبية هو طريق أبي نشيط محمد بن هارون المروزي، أما الحلواني فطريقه في الطيبة.","الطرق"],["قرأ الحلواني على قالون وعلى خلف البزار.",true,"أحمد بن يزيد الحلواني قرأ على قالون وعلى خلف البزار.","الطرق"],["يبسمل قالون بين كل سورتين عدا ما بين الأنفال وبراءة.",true,"قرأ بالبسملة بين السورتين عدا براءة، ولم يعدها آية من الفاتحة.","البسملة"],["لقالون بين السورتين وجه واحد هو الفصل.",false,"له بين السورتين الأوجه الثلاثة كحفص: القطع، والوصل، ووصل البسملة بأول السورة.","البسملة"],["يمد قالون المد المتصل ست حركات من طريق الشاطبية.",false,"المتصل عنده من الشاطبية بالتوسط أربع حركات، والإشباع من زيادات الطيبة.","المد"],["لقالون في المد المنفصل القصر والتوسط.",true,"له في المنفصل حركتان أو أربع.","المد"],["يجوز قصر المد المتصل عند بعض القراء.",false,"نص ابن الجزري على أنه تتبع ذلك فلم يجده في قراءة صحيحة ولا شاذة، بل رأى النص بمده.","المد"],["لقالون في ميم الجمع الواقعة قبل متحرك: الصلة والإسكان.",true,"يضم الميم ويصلها بواو حيث وقعت قبل متحرك بالخلف عنه.","ميم الجمع"],["الميم المتصل بها ضمير نحو «دخلتموه» يجري فيها الخلاف بين القراء.",false,"إذا اتصل بها ضمير فلا خلاف بين القراء في صلتها.","ميم الجمع"],["إذا وقع بعد ميم الجمع همز قطع فلقالون ثلاثة أوجه.",true,"الإسكان، والصلة مع القصر، والصلة مع التوسط كالمنفصل.","ميم الجمع"],["إذا وقع بعد ميم الجمع ساكن فإن قالون يصلها بواو.",false,"لا توصل، وإنما تضم للتخلص من التقاء الساكنين، ويوقف عليها بالسكون.","ميم الجمع"],["قرأ قالون «أرجه» بكسر الهاء دون صلة.",true,"هذا في موضعي الأعراف والشعراء.","هاء الكناية"],["قرأ قالون «ويتقه» بإسكان القاف كحفص.",false,"قرأها بكسر القاف والهاء دون صلة.","هاء الكناية"],["قرأ قالون «ويخلد فيه مهانًا» بكسر الهاء دون صلة.",true,"خالف بذلك حفصًا الذي يصلها.","هاء الكناية"],["قرأ قالون «أنسانيه» و«عليه الله» بكسر الهاء كالجمهور.",true,"حفص وحده من ضم الهاء فيهما.","هاء الكناية"],["لقالون في «يأته مؤمنًا» في طه وجه واحد هو الصلة.",false,"له في موضع طه الوجهان: الصلة وعدمها.","هاء الكناية"],["يسهل قالون الهمزة الثانية من الهمزتين في كلمة مع إدخال ألف بينهما.",true,"يسهل الثانية ويدخل بينهما ألفًا تمد حركتين.","الهمزتان من كلمة"],["يدخل قالون الألف في «أئمة».",false,"استثنى «أئمة» و«أآلهتنا» و«أآمنتم» من الإدخال، فسهل فيها دون إدخال.","الهمزتان من كلمة"],["لقالون في «أؤشهدوا خلقهم» الإدخال وعدمه.",true,"قرأه بالإدخال وعدمه.","الهمزتان من كلمة"],["في «آلذكرين» و«آلآن» و«آلله» لكل القراء الإبدال والتسهيل، والإبدال مقدم.",true,"الإبدال مع المد هو المقدم، وفيها التسهيل مع القصر.","الهمزتان من كلمة"],["في نحو «جاء أمة» يبدل قالون الهمزة الثانية واوًا.",false,"يسهلها بين الهمزة والواو؛ والإبدال واوًا يكون في المضمومة بعدها مفتوحة نحو «السفهاء ألا».","الهمزتان من كلمتين"],["في نحو «يشاء إلى» لقالون الإبدال واوًا مكسورة والتسهيل، والإبدال مقدم.",true,"له وجهان: الإبدال واوًا خالصة مكسورة وهو المقدم، والتسهيل بين الهمزة والياء.","الهمزتان من كلمتين"],["في الهمزتين المتفقتين المفتوحتين يسقط قالون الأولى.",true,"وافق أبا عمرو في إسقاط الأولى في المفتوحتين.","الهمزتان من كلمتين"],["في المتفقتين المكسورتين يسهل قالون الهمزة الثانية.",false,"يسهل الأولى في المكسورتين والمضمومتين.","الهمزتان من كلمتين"],["لقالون في «بالسوء إلا» ثلاثة أوجه، أولها إبدال الأولى واوًا مع الإدغام.",true,"الإبدال مع الإدغام، ثم التسهيل مع المد، ثم التسهيل مع القصر.","الهمزتان من كلمتين"],["قرأ قالون «للنبي إن» و«بيوت النبي إلا» بالإبدال والإدغام كحفص.",true,"عدل فيهما عن التسهيل إلى الإبدال ثم الإدغام.","الهمزتان من كلمتين"],["قرأ قالون «مؤصدة» بالهمز.",false,"قرأها بإبدال الهمزة واوًا.","الهمز المفرد"],["قرأ قالون «يأجوج ومأجوج» بإبدال الهمزة ألفًا.",true,"قرأها بالإبدال ألفًا.","الهمز المفرد"],["لقالون في «لأهب» في مريم وجهان.",true,"الياء «ليهب»، والهمز «لأهب» كحفص.","الهمز المفرد"],["قرأ قالون «هزوًا» و«كفوًا» بالواو كحفص.",false,"قرأهما بالهمز.","الهمز المفرد"],["قرأ قالون «البرية» بياء مشددة دون همز كحفص.",false,"قرأها بالهمز: «البريئة».","الهمز المفرد"],["يحقق قالون الهمزة الثانية في «أرأيت» و«أرأيتم» كحفص.",false,"يسهلها حيث وقعت.","الهمز المفرد"],["قرأ قالون بالنقل في «عادًا الأولى» في النجم.",true,"وفي الابتداء بها ثلاثة أوجه.","النقل"],["قرأ قالون «ردءًا يصدقني» بالنقل وصلًا ووقفًا بإبدال التنوين ألفًا.",true,"ينقل وصلًا، ويقف بإبدال التنوين ألفًا.","النقل"],["قرأ قالون «هار» في التوبة بالتقليل.",false,"قرأها بالإمالة الكبرى.","الإمالة"],["قرأ قالون «التوراة» بالإمالة الكبرى.",false,"له فيها الفتح والتقليل.","الإمالة"],["في الاستفهام المكرر يستفهم قالون في الأول ويخبر في الثاني في أكثر المواضع.",true,"يفعل ذلك في تسعة مواضع.","الاستفهام المكرر"],["خالف قالون حفصًا في موضع العنكبوت من الاستفهام المكرر.",false,"موضع العنكبوت موافق فيه لحفص: إخبار في الأول واستفهام في الثاني.","الاستفهام المكرر"],["يسكت قالون على «عوجًا» و«مرقدنا».",false,"لا سكت له في المواضع التي سكت فيها حفص.","السكت والإدغام"],["أدغم قالون النون في «من راق» واللام في «بل ران».",true,"قرأهما بالإدغام بلا سكت.","السكت والإدغام"],["لقالون في «يلهث ذلك» الإظهار والإدغام.",true,"نص الشاطبي على الخلف فيه لقالون.","السكت والإدغام"],["يثبت قالون ألف «أنا» وصلًا إذا جاء بعدها همز قطع مفتوح أو مضموم.",true,"يثبتها قولًا واحدًا في هذه الحال.","كلمة أنا"],["يحذف قالون ألف «أنا» وقفًا.",false,"الوقف بالإثبات في جميع المواضع كجميع القراء.","كلمة أنا"],["قرأ قالون «بيوت» بكسر الباء حيث وقعت.",true,"الضم لحفص وأبي عمرو وورش، والباقون بالكسر.","كلمات متفرقة"],["قرأ قالون «خطوات» بضم الطاء.",false,"قرأها بسكون الطاء حيث وقعت.","كلمات متفرقة"],["قرأ قالون «يحسب» بكسر السين.",true,"قرأه حيث ورد بكسر السين.","كلمات متفرقة"],["لقالون من الطيبة وجه الغنة عند إدغام النون الساكنة والتنوين في اللام والراء.",true,"وله من الشاطبية ترك الغنة.","زيادات الطيبة"],["لقالون في ياءات الإضافة زيادات من الطيبة على الشاطبية.",false,"له في ياءات الإضافة ما في الشاطبية بلا زيادة.","زيادات الطيبة"]],"MCQ":[["اسم الإمام قالون:",["عثمان بن سعيد","عيسى بن مينا","عيسى بن وردان","سليمان بن جماز"],1,"هو عيسى بن مينا المدني الزرقي، أبو موسى.","الترجمة"],["معنى «قالون» بلسان الروم:",["حافظ","معلم","قارئ","جيد"],3,"لقبه نافع بذلك لجودة قراءته.","الترجمة"],["وُلد قالون سنة:",["١٢٠هـ","١٣٠هـ","١٠٠هـ","١١٠هـ"],0,"ولد سنة ١٢٠هـ في أيام هشام بن عبد الملك.","الترجمة"],["توفي قالون بالمدينة قريبًا من سنة:",["١٦٩هـ","١٩٧هـ","٢٢٠هـ","٢٥٠هـ"],2,"توفي قريبًا من سنة ٢٢٠هـ في أيام المأمون.","الترجمة"],["ذكر الذهبي قالون ضمن علماء الطبقة:",["الثالثة","الرابعة","الخامسة","السادسة"],2,"ذكره في الطبقة الخامسة من القراء الكبار.","الترجمة"],["عرض قالون إضافةً إلى نافع على:",["عيسى بن وردان","ابن كثير","أبي عمرو","شيبة بن نصاح"],0,"عرض على عيسى بن وردان.","الترجمة"],["راوي قالون الذي عليه طريق الشاطبية:",["إسماعيل القاضي","أحمد بن صالح","الحلواني","أبو نشيط المروزي"],3,"طريق الشاطبية طريق أبي نشيط محمد بن هارون المروزي.","الطرق"],["من طرق قالون في الطيبة عن الحلواني:",["القزاز","جعفر بن محمد","إبراهيم بن ع كسور.","كلمة أنا"],["قرأ قالون «مبينات» بـ:",["كسر الياء","فتح الياء","إسكان الياء","ضم الياء"],1,"قرأ لفظ الجمع بفتح الياء.","كلمات متفرقة"],["مما زادته الطيبة لقالون في باب المد:",["إشباع البدل","مد اللين","قصر المتصل","توسط مد التعظيم"],3,"له وجه التوسط في مد التعظيم، ووجه إشباع المتصل.","زيادات الطيبة"],["زادت الطيبة لقالون في «والقرآن الحكيم» في يس:",["الإدغام","السكت","الإخفاء","الإظهار"],0,"له من الشاطبية الإظهار، وزادت الطيبة الإدغام.","زيادات الطيبة"],["عدد الأوجه في «الداع إذا دعان» وصلًا لقالون من الطيبة:",["وجهان","ثلاثة","أربعة","خمسة"],2,"حذفهما، أو إثباتهما، أو حذف إحداهما وإثبات الأخرى.","زيادات الطيبة"]],"ESSAY":[["ترجمي للإمام قالون ترجمة موجزة.","• اسمه: عيسى بن مينا المدني الزرقي، مولى الزهريين، معلم العربية، أبو موسى.\n• «قالون» لقب لقبه به نافع لجودة قراءته، ومعناه بالرومية: جيد.\n• ولد سنة ١٢٠هـ في أيام هشام بن عبد الملك، وتوفي بالمدينة قريبًا من سنة ٢٢٠هـ.\n• تصدر للإقراء ونافع حي، وكان أصم لا يسمع البوق فإذا قرأ عليه قارئ سمعه.\n• ذكره الذهبي في الطبقة الخامسة، وأخرج له أبو عوانة والطبراني وابن المقرئ.","الترجمة"],["اذكري شيوخ قالون وطائفة من تلاميذه.","• شيوخه: نافع، أخذ عنه قراءته وقراءة أبي جعفر، وعرض على عيسى بن وردان.\n• تلاميذه: ابناه إبراهيم وأحمد، وأحمد بن يزيد الحلواني، ومحمد بن هارون المروزي، وأحمد بن صالح المصري، وإسماعيل القاضي، وغيرهم.","الترجمة"],["بيّني طرق قالون في الشاطبية والطيبة.","• الشاطبية: من طريق أبي نشيط محمد بن هارون المروزي.\n• الطيبة: من طريق أبي نشيط (ومنه طريق القزاز) ومن طريق أحمد بن يزيد الحلواني (ومنه طريق الجمال وطريق جعفر بن محمد).","الطرق"],["فصّلي أحكام ميم الجمع عند قالون.","• قبل المتحرك: الصلة والإسكان بالخلف.\n• قبل همز القطع: ثلاثة أوجه: الإسكان، والصلة مع القصر، والصلة مع التوسط.\n• قبل غير الهمز من المتحرك: وجهان: الإسكان والصلة مع القصر.\n• قبل الساكن: تضم للتخلص بلا صلة، ويوقف عليها بالسكون.\n• المتصل بها ضمير: صلتها لجميع القراء.","ميم الجمع"],["اذكري المواضع التي خالف فيها قالون حفصًا في هاء الكناية.","• بكسر الهاء دون صلة: أرجه، فألقه، يؤده، نؤته، نوله، نصله، يخلد فيه.\n• «ويتقه»: بكسر القاف والهاء دون صلة.\n• «أنسانيه» و«عليه الله»: بكسر الهاء كالجمهور.\n• «يأته مؤمنًا» في طه: الصلة وعدمها.","هاء الكناية"],["بيّني مذهب قالون في الهمزتين من كلمة، مع المستثنيات.","• يسهل الثانية مع إدخال ألف بينهما.\n• يسهل دون إدخال في: أئمة، أآلهتنا، أآمنتم.\n• له في «أؤشهدوا» الإدخال وعدمه.\n• زاد همزة استفهام في «أآمنتم» و«أؤشهدوا» خلافًا لحفص.\n• في «آلذكرين» و«آلآن» و«آلله»: الإبدال (المقدم) والتسهيل لكل القراء.","الهمزتان من كلمة"],["فصّلي أحكام الهمزتين المختلفتين من كلمتين عند قالون.","• مفتوحة فمضمومة: تسهيل الثانية بين الهمزة والواو.\n• مفتوحة فمكسورة: تسهيل الثانية بين الهمزة والياء.\n• مضمومة فمفتوحة: إبدال الثانية واوًا مفتوحة.\n• مكسورة فمفتوحة: إبدال الثانية ياءً مفتوحة.\n• مضمومة فمكسورة: الإبدال واوًا مكسورة (المقدم)، والتسهيل بين الهمزة والياء.","الهمزتان من كلمتين"],["بيّني حكم الهمزتين المتفقتين من كلمتين عند قالون، مع ما استثني.","• المفتوحتان: إسقاط الأولى، وفي المد قبلها القصر ثم التوسط.\n• المكسورتان والمضمومتان: تسهيل الأولى، وفي المد قبلها المد ثم القصر.\n• «بالسوء إلا»: إبدال الأولى واوًا مع الإدغام، ثم التسهيل مع المد، ثم مع القصر.\n• «للنبي إن» و«بيوت النبي إلا»: الإبدال والإدغام كحفص.","الهمزتان من كلمتين"],["اذكري الكلمات التي خالف فيها قالون حفصًا في الهمز المفرد (إبدالًا وحذفًا وتسهيلًا وهمزًا).","• الإبدال: يأجوج ومأجوج، مؤصدة، منسأته، سأل، رئيا، ولأهب بوجهين.\n• الحذف: يضاهون، الصابون، الصابين، واللاء بحذف الياء.\n• التسهيل: أرأيت وأرأيتم وأفرأيتم حيث وقعت.\n• الهمز: هزؤا، كفؤا، ميكائل، البريئة، النبيء والنبوءة عدا موضعي الأحزاب.","الهمز المفرد"],["اذكري مواضع النقل عند قالون وأوجهها.","• «عادًا الأولى»: النقل، وفي الابتداء ثلاثة أوجه: الأولى، لؤلى، الؤلى.\n• «آلآن» في موضعي يونس: وصلًا ثلاثة أوجه: الإبدال مع الإشباع، والإبدال مع القصر، والتسهيل.\n• «ردءًا يصدقني»: النقل وصلًا، والوقف بإبدال التنوين ألفًا.","النقل"],["بيّني مذهب قالون في الاستفهام المكرر.","• يستفهم في الأول ويخبر في الثاني في تسعة مواضع.\n• يخبر في الأول ويستفهم في الثاني في موضعي النمل والعنكبوت، والعنكبوت موافق فيه لحفص.\n• وهو على أصله في تسهيل الهمزة الثانية.","الاستفهام المكرر"],["اذكري حكم «أنا» عند قالون وصلًا ووقفًا.","• يثبت الألف وصلًا قبل همز القطع المفتوح أو المضموم قولًا واحدًا.\n• يثبتها بالخلف قبل الهمز المكسور.\n• يحذفها وصلًا قبل غير الهمز.\n• يثبتها وقفًا في جميع المواضع كجميع القراء.","كلمة أنا"],["عددي أهم زيادات الطيبة لقالون على الشاطبية.","• المد: توسط مد التعظيم، وإشباع المتصل، وقصر «عين».\n• الهمز: إبدال «أئمة» ياءً، والتسهيل دون إدخال قبل المضمومة، وإبدال «المؤتفكات».\n• النقل: ترك همز الواو في «الأولى».\n• الإدغام: إظهار «ويعذب من»، وإدغام «يس والقرآن»، والغنة في اللام والراء.\n• الإمالة: فتح «هار»، وتقليل «كهيعص».\n• الزوائد: إثبات ياء «التناد» و«التلاق» وصلًا، وأربعة أوجه في «الداع إذا دعان».","زيادات الطيبة"]]},"ibk":{"title":"أسئلة أصول قراءة ابن كثير","sub":"من طريقي الشاطبية والطيبة","lede":"براوييه البزي وقنبل: صح وخطأ، واختيار من متعدد، وأسئلة مقالية مع الإجابات.","foot":"المادة مأخوذة من عرض «أصول قراءة الإمام ابن كثير براوييه البزي وقنبل من طريقي الشاطبية والطيبة» جمع وترتيب الشيخ ميسرة بن يوسف حجو، وصيغت أسئلتها دون ذكر الشواهد.","TF":[["الإمام ابن كثير هو عبد الله بن كثير المكي الداري، ويكنى أبا معبد.",true,"هو عبد الله بن كثير بن عمرو المكي الداري، أبو معبد، وقيل: أبو محمد.","الترجمة"],["لقب «الداري» عند ابن الجزري معناه: الذي لا يبرح داره ولا يطلب معاشًا.",false,"الذي صححه ابن الجزري أنه قيل له الداري لأنه كان عطارًا، والعرب تسمي العطار داريًّا نسبة إلى «دارين».","الترجمة"],["وُلد ابن كثير بمكة سنة خمس وأربعين وتوفي بها سنة عشرين ومئة.",true,"ولد بمكة سنة ٤٥هـ في أيام معاوية رضي الله عنه، وتوفي بها سنة ١٢٠هـ.","الترجمة"],["من شيوخ ابن كثير في القراءة مجاهد بن جبر المكي.",true,"من أشهر شيوخه: عبد الله بن السائب المخزومي، ومجاهد بن جبر، ودرباس مولى ابن عباس.","الترجمة"],["أبو عمرو بن العلاء من تلاميذ ابن كثير.",true,"قال أبو عمرو: ختمت القرآن على ابن كثير بعدما ختمت على مجاهد.","الترجمة"],["البزي كان مؤذن المسجد الحرام ومقرئ مكة.",true,"البزي أحمد بن محمد بن عبد الله بن القاسم بن أبي بزة، مقرئ مكة ومؤذن المسجد الحرام.","الرواة"],["أخذ البزي القراءة عن ابن كثير مباشرة.",false,"أخذها بواسطة: قرأ على عكرمة بن سليمان، وقرأ عكرمة على شبل والقسط، وهما قرآ على ابن كثير.","الرواة"],["قنبل روى القراءة عن البزي أيضًا.",true,"أخذ قنبل عرضًا عن أحمد بن محمد بن عون القواس، وروى القراءة عن البزي.","الرواة"],["تولى البزي الشرطة بمكة في وسط عمره.",false,"الذي تولى الشرطة بمكة هو قنبل، وكانت لا يليها إلا رجل من أهل الفضل والصلاح، فحمدت سيرته.","الرواة"],["طريق قنبل في الشاطبية هو طريق أبي ربيعة.",false,"أبو ربيعة طريق البزي (النقاش عن أبي ربيعة)، وطريق قنبل: السامري عن ابن مجاهد.","الطرق"],["يعد ابن كثير البسملة آية من الفاتحة.",true,"عدّها آية من الفاتحة، وقرأ بالبسملة بين السورتين عدا براءة.","البسملة"],["لابن كثير بين السورتين الوصل والسكت بلا بسملة.",false,"يبسمل بين كل سورتين عدا براءة، وله الأوجه الثلاثة كحفص.","البسملة"],["يقصر ابن كثير المد المنفصل حركتين من طريق الشاطبية.",true,"من أصحاب القصر في المنفصل، فيمده حركتين فقط.","المد والقصر"],["يجوز قصر المد المتصل عند ابن كثير.",false,"لا يجوز قصر المتصل عند أحد من القراء، ومذهبه فيه التوسط أربع حركات من الشاطبية.","المد والقصر"],["يصل ابن كثير ميم الجمع بواو إذا وقع بعدها متحرك، سواء كان همزًا أو غيره.",true,"يضم ميم الجمع ويصلها بواو قبل المتحرك مطلقًا، ويقف عليها بالسكون.","ميم الجمع"],["يصل ابن كثير ميم الجمع إذا وقع بعدها ساكن.",false,"قبل الساكن لا صلة، وإنما تضم الميم للتخلص من التقاء الساكنين.","ميم الجمع"],["يصل ابن كثير هاء الكناية إذا وقعت بين ساكن ومتحرك، نحو: «فيهِ هدى».",true,"يصلها بياء أو واو مدية إذا كان قبلها ساكن وبعدها متحرك، فيقرأ: «فيهي هدى».","هاء الكناية"],["يقرأ ابن كثير «أرجئهُ» بالهمز مع ضم الهاء وصلتها.",true,"يزيد همزة ساكنة بعد الجيم، ويضم الهاء ويصلها بواو.","هاء الكناية"],["يقرأ ابن كثير «ويتقهْ» بإسكان القاف كحفص.",false,"يقرؤها بكسر القاف والهاء مع الصلة: «ويتقِهِي».","هاء الكناية"],["يُدخل ابن كثير ألفًا بين الهمزتين من كلمة.",false,"يسهّل الثانية من غير إدخال ألف بينهما.","الهمزتان من كلمة"],["يقرأ ابن كثير «إنك لأنت يوسف» بالإخبار، بخلاف حفص.",true,"قرأ موضع يوسف بالإخبار بهمزة واحدة.","الهمزتان من كلمة"],["يقرأ قنبل «ءامنتم» في سورة طه بالاستفهام من طريق الشاطبية.",false,"له في طه الإخبار كحفص من الشاطبية، والاستفهام في الأعراف والشعراء.","الهمزتان من كلمة"],["يبدل البزي الهمزة الأولى واوًا في «فرعونُ ءامنتم» حال الوصل.",false,"الإبدال لقنبل في وصل الأعراف والملك، أما البزي فيحقق الأولى ويسهّل الثانية.","الهمزتان من كلمة"],["في نحو «السفهاءُ ألا» يبدل ابن كثير الهمزة الثانية واوًا مفتوحة.",true,"إذا كانت الأولى مضمومة والثانية مفتوحة أبدل الثانية واوًا خالصة مفتوحة.","الهمزتان من كلمتين"],["يُسقط البزي الأولى من الهمزتين المتفقتين في الفتح، نحو «جاء أجلهم».",true,"يوافق أبا عمرو في إسقاط الأولى إذا كانتا مفتوحتين، ويسهّل الأولى في المكسورتين والمضمومتين.","الهمزتان من كلمتين"],["لقنبل في الهمزتين المتفقتين من كلمتين: تسهيل الثانية أو إبدالها حرف مد.",true,"له وجهان من الشاطبية: التسهيل بين بين، والإبدال حرف مد.","الهمزتان من كلمتين"],["يقرأ ابن كثير «يأجوج ومأجوج» بالهمز كحفص.",false,"قرأهما بإبدال الهمزة ألفًا: «ياجوج وماجوج».","الهمز المفرد"],["يقرأ ابن كثير «مؤصدة» بترك الهمز.",true,"يقرأ «موصدة» بالواو، والهمز لحفص وأبي عمرو وحمزة.","الهمز المفرد"],["يقرأ ابن كثير «يضاهئون» بالهمز.",false,"قرأ «يضاهُون» بضم الهاء وحذف الهمزة.","الهمز المفرد"],["يقرأ قنبل «ضئاء» بهمزة مفتوحة مكان الياء في مواضعه الثلاثة.",true,"في يونس والأنبياء والقصص.","الهمز المفرد"],["ينقل ابن كثير حركة الهمزة إلى الراء في «القرآن» و«قرآن» حيث وقعا.",true,"يقرأ «القُرَان» و«قُرَان» بنقل فتحة الهمزة إلى الراء وحذف الهمزة.","النقل"],["يكرر ابن كثير الاستفهام في الموضعين في جميع مواضع الاستفهام المكرر.",false,"استفهم في الموضعين في عشرة مواضع، وأخبر في الأول واستفهم في الثاني في موضع العنكبوت.","الاستفهام المكرر"],["لم يمل ابن كثير شيئًا في القرآن.",true,"ليس له إمالة، وقرأ «مُجراها» بضم الميم وفتح الراء.","الإمالة"],["يسكت ابن كثير على «مَن راق» و«بل ران».",false,"لا سكت له، فيدغم النون في الراء واللام في الراء.","السكت والإدغام"],["يظهر ابن كثير الثاء في «يلهث ذلك».",true,"قرأ بالإظهار، والإدغام عنده زيادة من الطيبة.","الإدغام والإظهار"],["للبزي في «اركب معنا» وجهان: الإدغام والإظهار.",true,"وأما قنبل فله الإدغام من الشاطبية.","الإدغام والإظهار"],["يقف ابن كثير على «رحمت» المرسومة بالتاء بالهاء.",true,"يقف بالهاء على هاء التأنيث المرسومة تاءً: «رحمه».","الوقف على مرسوم الخط"],["يقف ابن كثير على «مرضات» و«ذات» بالهاء.",false,"يقف عليهما بالتاء كحفص.","الوقف على مرسوم الخط"],["يقف البزي على «هيهات» بالهاء، ويقف قنبل بالتاء من الشاطبية.",true,"البزي: «هيهاه»، وقنبل: «هيهات».","الوقف على مرسوم الخط"],["تشديد البزي للتاءات يكون في الوصل دون الابتداء.",true,"يشدد التاء وصلًا، فإذا ابتدأ بالكلمة خففها كالجماعة.","تاءات البزي"],["المحقق للبزي في «كنتم تمنّون» و«فظلتم تفكّهون» التشديد.",false,"اختلف عنه فيهما، والراجح الذي حققه العلماء التخفيف كالجماعة.","تاءات البزي"],["يفتح ابن كثير ياء الإضافة قبل همزة القطع المفتوحة في الغالب.",true,"فتحها في تسعة وتسعين موضعًا، إلا أربعة مواضع اتفق القراء على إسكانها.","ياءات الإضافة"],["يفتح ابن كثير ياء «عهدي» في «لا ينال عهدي الظالمين».",true,"فتحها ابن كثير وأسكنها حفص.","ياءات الإضافة"],["يفتح ابن كثير ياء «معي» كحفص.",false,"أسكنها ابن كثير في مواضعها، وفتحها حفص.","ياءات الإضافة"],["القاعدة العامة لابن كثير في ياءات الزوائد: الحذف وصلًا ووقفًا.",false,"قاعدته إثبات الياء الزائدة وصلًا ووقفًا.","ياءات الزوائد"],["يقف ابن كثير بالياء على «هادٍ» و«واقٍ» و«والٍ» و«باقٍ».",true,"يقف بإثبات الياء في هذه الكلمات المنونة ويحذفها وصلًا.","ياءات الزوائد"],["يقرأ قنبل «خطوات» بإسكان الطاء.",false,"الإسكان للبزي، وقنبل بالضم كحفص.","كلمات متكررة"],["يكسر ابن كثير الباء في «بيوت» والعين في «عيون».",true,"ويكسر الشين في «شيوخا» أيضًا.","كلمات متكررة"],["يبدأ التكبير عند البزي من أول سورة الضحى.",false,"يبدأ من آخر سورة الضحى إلى آخر سورة الناس، وصيغته «الله أكبر».","التكبير"],["يجوز وصل آخر السورة بالتكبير والبسملة ثم الوقف على البسملة.",false,"لا يجوز؛ لأنه يوهم أن البسملة لآخر السورة.","التكبير"],["إشباع المد المتصل لابن كثير وجه زائد من طريق الطيبة.",true,"من الشاطبية التوسط، وزادت الطيبة الإشباع كباقي القراء.","زيادات الطيبة"],["لابن كثير الغنة عند إدغام النون الساكنة والتنوين في اللام والراء من الشاطبية.",false,"من الشاطبية ترك الغنة، والغنة زيادة من الطيبة.","زيادات الطيبة"]],"MCQ":[["لُقّب ابن ك بدال بخلف عنه","الحذف","التسهيل","الهمز فقط"],0,"يقدم الهمزة إلى موضع الياء ويبدلها ألفًا ويؤخر الياء: «ولا تايسوا»، بخلف عنه.","الهمز المفرد"],["يقرأ ابن كثير بالنقل في فعل الأمر من «سأل» إذا:",["تلته همزة وصل","وقع في آخر الآية","كان أول الكلام","سبقته واو أو فاء"],3,"نحو «وسَلوا» و«فسَلوا».","النقل"],["قراءة ابن كثير في «الأيكة» بالشعراء وص:",["الأيكة كحفص","ليكة بلام مفتوحة بلا همز","الليكة بلامين","لأيكة"],1,"بلام مفتوحة من غير همزة وصل قبلها ولا همز بعدها، مع فتح التاء.","النقل"],["الموضع الذي أخبر فيه ابن كثير في الأول واستفهم في الثاني:",["الإسراء","العنكبوت","النازعات","الرعد"],1,"«إنكم لتأتون الفاحشة… أئنكم لتأتون الرجال».","الاستفهام المكرر"],["كيف يقرأ ابن كثير «مجراها» في هود؟",["مَجراها بالفتح","مُجريها بالتقليل","مَجريها بالإمالة","مُجراها بضم الميم والفتح"],3,"بضم الميم وفتح الراء دون إمالة.","الإمالة"],["قراءة ابن كثير في «يعذب من يشاء» آخر البقرة من الشاطبية:",["الإظهار مع جزم الباء","الرفع مع الإظهار","الإخفاء","الإدغام"],0,"الإظهار مع إسكان الباء وقلقلتها، والإدغام زيادة من الطيبة.","الإدغام والإظهار"],["يقف ابن كثير على «يا أبت»:",["بالروم","بالتاء","بالهاء","بالألف"],2,"يقف عليها بالهاء: «يا أبه».","الوقف على مرسوم الخط"],["وقف البزي على «عمّ» و«فيم» و«بم» و«مم» و«لم»:",["بالسكون فقط","بهاء السكت فقط","بهاء السكت بخلف عنه","بالروم"],2,"له فيها الوجهان: هاء السكت والسكون.","الوقف على مرسوم الخط"],["عدد المواضع التي شدد فيها البزي التاء باتفاق الناقلين عنه:",["واحد وثلاثون","ثلاثة وثلاثون","أحد عشر","واحد وعشرون"],0,"واحد وثلاثون موضعًا باتفاق، وموضعان مختلف فيهما.","تاءات البزي"],["من مواضع تاءات البزي:",["«تتلى عليهم»","«تذكرون»","«تكلمون»","«ولا تيمموا الخبيث»"],3,"يقرأ: «ولا تَّيمموا» بالتشديد وصلًا.","تاءات البزي"],["في «عندي أولم» (القصص) المحقق من طريق الشاطبية:",["الإسكان للراويين","البزي بالإسكان وقنبل بالفتح","البزي بالفتح وقنبل بالإسكان","الفتح للراويين"],1,"ظاهر النظم الوجهان، والمحقق أن البزي بالإسكان وقنبل بالفتح.","ياءات الإضافة"],["ياء الإضافة التي فتحها ابن كثير وأسكنها حفص:",["«معي»","«من ورائي وكانت»","«ولي نعجة»","«بيتي»"],1,"فتح «ورائي» و«شركائي قالوا»، وأسكن «ولي نعجة» و«بيتي» و«معي» خلافًا لحفص.","ياءات الإضافة"],["حكم «لي دين» في الكافرون:",["الفتح لقنبل والإسكان للبزي","الفتح للراويين","الإسكان للراويين","الفتح للبزي بخلف والإسكان لقنبل"],3,"البزي بالفتح والإسكان، وقنبل بالإسكان.","ياءات الإضافة"],["قراءة ابن كثير في «نرتع ونلعب» (يوسف):",["نرتعِ بالنون وكسر العين","نرتعْ بالجزم","يرتعي بالياء","يرتع ويلعب"],0,"بالنون وكسر العين، ولقنبل خلف في إثبات الياء.","ياءات الزوائد"],["حكم الياء في «فما آتاني الله» (النمل) لابن كثير من الشاطبية:",["الإثبات وقفًا فقط","الإثبات وصلًا ووقفًا","الحذف وصلًا ووقفًا","الإثبات وصلًا فقط"],2,"حذفها وصلًا ووقفًا خلافًا لقاعدته في الزوائد.","ياءات الزوائد"],["«مبيّنة» المفردة عند ابن كثير:",["بالوجهين","بكسر الياء","بفتح الياء","بإسكان الياء"],2,"بفتح الياء حيث وقعت، وكذلك «مبيّنات».","كلمات متكررة"],["صيغة التكبير للبزي من طريق الشاطبية:",["الله أكبر","لا إله إلا الله والله أكبر","الله أكبر ولله الحمد","سبحان الله والله أكبر"],0,"صيغته «الله أكبر» فقط، والزيادة عليها ليست من طريق الشاطبية.","التكبير"],["من زيادات الطيبة لقنبل:",["إدغام «اركب معنا»","الوقف بالتاء على «هيهات»","صلة ميم الجمع","إسقاط الهمزة الأولى من الهمزتين المتماثلتين من كلمتين"],3,"له من الطيبة الإسقاط، ومن الشاطبية الإبدال والتسهيل.","زيادات الطيبة"]],"ESSAY":[["ترجمي للإمام ابن كثير ترجمة موجزة.","• اسمه: عبد الله بن كثير بن عمرو المكي الداري، أبو معبد.\n• لقب «الداري» لأنه كان عطارًا، وهو الذي صححه ابن الجزري.\n• ولد بمكة سنة ٤٥هـ، وتوفي بها سنة ١٢٠هـ.\n• من شيوخه: عبد الله بن السائب المخزومي، ومجاهد بن جبر، ودرباس مولى ابن عباس.\n• من تلاميذه: أبو عمرو بن العلاء، والخليل بن أحمد، وحماد بن زيد، وسفيان بن عيينة.\n• كان إمام الناس في القراءة بمكة، لم ينازعه فيها منازع.","الترجمة"],["عرّفي براويَي ابن كثير، وبيّني كيف اتصل سندهما به، وطريق كل منهما في الشاطبية.","• البزي: أحمد بن محمد بن عبد الله بن أبي بزة، مقرئ مكة ومؤذن المسجد الحرام، توفي سنة ٢٥٠هـ.\n• سنده: قرأ على عكرمة بن سليمان، عن شبل والقسط، عن ابن كثير.\n• قنبل: محمد بن عبد الرحمن المخزومي المكي، انتهت إليه رئاسة الإقراء بالحجاز، توفي سنة ٢٩١هـ.\n• سنده: قرأ على القواس عن وهب بن واضح عن القسط عن ابن كثير، وأخذ عن البزي أيضًا.\n• طريق الشاطبية: للبزي النقاش عن أبي ربيعة، ولقنبل السامري عن ابن مجاهد.","الرواة والطرق"],["بيّني مذهب ابن كثير في ميم الجمع وهاء الكناية.","• ميم الجمع: يضمها ويصلها بواو إذا كان بعدها متحرك، همزًا كان أو غيره، ويقف عليها بالسكون.\n• إذا وقع بعدها ساكن لم يصلها، وإنما يضمها للتخلص من التقاء الساكنين.\n• هاء الكناية: يصلها إذا وقعت بين ساكن ومتحرك، نحو «فيهي هدى» و«اجتباهو».\n• «أرجئهو» بالهمز وضم الهاء والصلة، و«يرضهو» بالضم والصلة، و«ويتقِهي» بكسر القاف والهاء مع الصلة.","ميم الجمع وهاء الكناية"],["اذكري مذهب ابن كثير في الهمزتين من كلمة، مع ما خالف فيه حفصًا من الكلمات.","• يسهّل الهمزة الثانية بين بين من غير إدخال ألف.\n• زاد همزة الاستفهام في: «أأن يؤتى» (آل عمران)، و«أإنكم» (الأعراف)، و«أأذهبتم» (الأحقاف)، مع تسهيل الثانية.\n• قرأ «إنك لأنت يوسف» بالإخبار.\n• «ءامنتم»: البزي بالاستفهام والتسهيل في الأعراف وطه والشعراء، وقنبل بالاستفهام في الأعراف والشعراء والإخبار في طه.\n• في وصل «فرعون ءامنتم» و«النشور ءأمنتم» يبدل قنبل الأولى واوًا ويسهل الثانية.","الهمزتان من كلمة"],["فصّلي حكم الهمزتين المختلفتين في الحركة من كلمتين عند ابن كثير.","• مفتوحة ثم مضمومة «جاء أمة»: تسهيل الثانية بين الهمزة والواو.\n• مفتوحة ثم مكسورة «شهداء إذ»: تسهيل الثانية بين الهمزة والياء.\n• مضمومة ثم مفتوحة «السفهاء ألا»: إبدال الثانية واوًا مفتوحة.\n• مكسورة ثم مفتوحة «النساء أو»: إبدال الثانية ياء مفتوحة.\n• مضمومة ثم مكسورة «يشاء إلى»: إبدالها واوًا مكسورة (وهو المقدم)، أو تسهيلها بين الهمزة والياء.","الهمزتان من كلمتين"],["قارني بين البزي وقنبل في الهمزتين المتفقتين في الحركة من كلمتين.","• البزي: يسقط الأولى في المفتوحتين، ويسهّل الأولى في المكسورتين والمضمومتين.\n• للبزي في «بالسوء إلا» زيادة: إبدال الأولى واوًا مع الإدغام.\n• قنبل: يسهّل الثانية أو يبدلها حرف مد من جنس حركة ما قبلها.\n• إذا أُبدلت ووقع بعدها ساكن مُدت ست حركات.\n• حرف المد قبل الهمز المغيّر يجوز فيه المد والقصر.\n• من الطيبة لقنبل زيادة إسقاط الأولى.","الهمزتان من كلمتين"],["عددي أبرز ما خالف فيه ابن كثير حفصًا في باب الهمز المفرد والنقل.","• «ياجوج وماجوج» بالإبدال، و«موصدة» بالواو، و«يضاهون» بلا همز.\n• «ميكائيل» بالهمزة والياء، و«زكرياء» بالهمز، و«مناءة» و«ضئزى» بالهمز.\n• «مرجئون» و«ترجئ» بالهمز.\n• لقنبل: «ضئاء» بالهمز، و«ها أنتم» بحذف الألف، و«اللاء» بالهمز بلا ياء.\n• للبزي: «اللايْ» بياء ساكنة مع الإشباع، أو بالتسهيل، و«ولا تايسوا» بالقلب والإبدال بخلف عنه.\n• النقل: «وسَلوا» و«فسَلوا»، و«القُرَان» و«قُرَان» حيث وقعا، و«ليكة» في الشعراء وص.","الهمز المفرد والنقل"],["بيّني مذهب ابن كثير في الإدغام والإظهار، والسكت، والإمالة.","• يدغم «مَن راق» و«بل ران» من غير سكت.\n• يظهر «يلهث ذلك» و«يعذب من» آخر البقرة مع جزم الباء.\n• في «اركب معنا»: للبزي الإدغام والإظهار، ولقنبل الإدغام.\n• السكت: ليس له سكت.\n• الإمالة: ليس له إمالة في القرآن، ويقرأ «مُجراها» بضم الميم والفتح.","الإدغام والسكت والإمالة"],["ما المقصود بتاءات البزي؟ وما حكمها؟ مع التمثيل.","• هي تاءات في أول الأفعال المضارعة، أصلها تاءان، حذفت إحداهما تخفيفًا.\n• يشددها البزي وصلًا بإدغام إحداهما في الأخرى، ويبتدئ بها مخففة.\n• عددها واحد وثلاثون موضعًا باتفاق، نحو: «ولا تيمموا»، «ولا تفرقوا»، «تنزل الملائكة»، «نارا تلظى».\n• اختُلف عنه في «كنتم تمنون» و«فظلتم تفكهون»، والراجح فيهما التخفيف.\n• زادت له الطيبة التخفيف في الجميع.","تاءات البزي"],["اذكري القاعدة العامة لابن كثير في ياءات الإضافة قبل همزة القطع المفتوحة، مع أمثلة لما خالف فيه حفصًا في سائر الأقسام.","• يفتح ياء الإضافة قبل همزة القطع المفتوحة في الجملة، إلا أربعة مواضع اتفق القراء على إسكانها.\n• فتح خلافًا لحفص: «ذروني أقتل»، «ادعوني أستجب»، «فاذكروني أذكركم»، «لعلي» في ستة مواضع، «عهدي الظالمين».\n• وفتح: «إني اصطفيتك»، «أخي اشدد»، «لنفسي اذهب»، «ذكري اذهبا»، «من بعدي اسمه»، «ورائي وكانت»، «شركائي قالوا».\n• أسكن خلافًا لحفص: «يدي» في المائدة، «أجري»، «معي»، «بيتي»، «ولي نعجة»، «ولي فيها مآرب».\n• للبزي وحده الفتح في «أوزعني أن» و«ولكني أراكم» و«فطرني أفلا» و«قومي اتخذوا».","ياءات الإضافة"],["ما قاعدة ابن كثير في ياءات الزوائد؟ وما المواضع التي خرج فيها عنها أو انفرد بها أحد راوييه؟","• القاعدة: إثبات الياء الزائدة وصلًا ووقفًا، نحو «الداعي»، «الجواري»، «المنادي»، «يهديني»، «أخرتني»، «ألا تتبعني».\n• للبزي وحده: «أكرمني» و«أهانني»، و«دعائي» في إبراهيم.\n• لقنبل وحده: إثبات «يتقي ويصبر».\n• «بالوادي»: يثبتها الراويان وصلًا، وفي الوقف للبزي الإثبات، ولقنبل الإثبات والحذف.\n• خرج عن قاعدته في «فما آتاني الله» فحذفها وصلًا ووقفًا.\n• يقف بالياء على «هادٍ» و«والٍ» و«واقٍ» و«باقٍ» ويحذفها وصلًا.","ياءات الزوائد"],["تحدثي عن التكبير عند البزي: دليله، ومبدؤه، وصيغته، والأوجه الجائزة والممنوعة.","• رواه البزي عن عكرمة عن القسط عن ابن كثير عن مجاهد عن ابن عباس عن أبي بن كعب عن النبي ﷺ.\n• يبدأ من آخر الضحى إلى آخر الناس، وصيغته «الله أكبر».\n• الأوجه الجائزة خمسة: قطع الجميع، ووصل الجميع، ووصل الآخر بالتكبير مع الوقف ثم البسملة مع الوقف، وقطع الآخر والتكبير ثم وصل البسملة بالسورة، ووصل الآخر بالتكبير والوقف ثم وصل البسملة بالسورة.\n• يمتنع وصل التكبير بالبسملة مع الوقف عليها؛ لإيهام أن البسملة لآخر السورة.\n• ويمتنع الوقف على آخر السورة ثم وصل التكبير بالبسملة بأول السورة؛ لإيهام أن التكبير لأولها.","التكبير"],["اذكري خمسًا من زيادات الطيبة على الشاطبية لابن كثير أو أحد راوييه.","• إشباع المد المتصل، والتوسط في مد التعظيم، والقصر في «عين» فاتحة مريم والشورى.\n• إبدال الثانية ياء في «أئمة».\n• إدغام «يلهث ذلك» و«يعذب من»، والغنة عند إدغام النون والتنوين في اللام والراء.\n• للبزي تخفيف التاءات.\n• لقنبل: إثبات الألف في «ها أنتم»، والإظهار في «اركب معنا»، والوقف بالهاء على «هيهات»، وكسر التنوين نحو «خبيثةٍ اجتثت».","زيادات الطيبة"]]},"abj":{"title":"أسئلة أصول قراءة أبي جعفر","sub":"من طريق الدرة المضية","lede":"براوييه ابن وردان وابن جماز: صح وخطأ، واختيار من متعدد، وأسئلة مقالية مع الإجابات.","foot":"المادة مأخوذة من عرض «أصول قراءة الإمام أبي جعفر براوييه» جمع وترتيب الشيخ ميسرة بن يوسف حجو، وصيغت أسئلتها دون ذكر الشواهد.","TF":[["يفصل أبو جعفر بالبسملة بين السورتين بالأوجه الثلاثة، سوى ما بين الأنفال والتوبة.",true,"له الفصل بالبسملة بين كل سورتين بالأوجه الثلاثة إلا التوبة.","البسملة"],["يمد أبو جعفر المد المنفصل أربع حركات.",false,"المنفصل له بالقصر حركتين، والمتصل أربع حركات.","المد والقصر"],["يسكت أبو جعفر على «عوجًا» في أول الكهف كحفص.",false,"لم يسكت على شيء من السكتات الواجبة لحفص، وإنما يسكت على حروف الهجاء المقطعة في أوائل السور.","السكت"],["يسكت أبو جعفر على حروف الهجاء المقطعة في فواتح السور، نحو: «ألف لام ميم».",true,"هذا من أصوله الخاصة في باب السكت.","السكت"],["يقرأ أبو جعفر «تأمنّا» بالإدغام المحض من غير روم ولا إشمام.",true,"أدغم النون في النون إدغامًا محضًا بدون روم ولا إشمام.","الإدغام"],["يدغم أبو جعفر الثاء في الذال في «يلهث ذلك».",false,"أظهر أبو جعفر «يلهث ذلك» و«اركب معنا».","الإدغام"],["يخفي أبو جعفر النون الساكنة والتنوين عند الخاء والغين، إلا في ثلاث كلمات.",true,"استثنى: «يكن غنيًّا»، و«المنخنقة»، و«فسينغضون» فأظهرها.","الإدغام والإظهار"],["يصل أبو جعفر ميم الجمع إذا وقعت قبل ساكن.",false,"يصلها قبل المتحرك بمقدار حركتين، أما قبل الساكن فلا صلة، وتضم لالتقاء الساكنين.","ميم الجمع"],["لا يميل أبو جعفر ولا يقلل شيئًا في القرآن، كابن كثير.",true,"ليس له إمالة ولا تقليل في شيء من القرآن.","الإمالة"],["يقرأ أبو جعفر «مجراها» بفتح الميم مع الإمالة.",false,"يقرؤها بضم الميم وفتح الراء: «مُجراها»، بلا إمالة.","الإمالة"],["يسكّن أبو جعفر الهاء في «يؤدّه» و«نؤته» و«نولّه» و«نصله».",true,"خالف حفصًا في هذه الكلمات فأسكن الهاء فيها.","هاء الكناية"],["يقرأ ابن وردان «يرضه» بإسكان الهاء.",false,"ابن وردان يضم الهاء مع الصلة، والذي يسكنها هو ابن جماز.","هاء الكناية"],["يقرأ ابن جماز «أرجه» بكسر الهاء مع الصلة.",true,"ابن جماز بالكسر مع الصلة، وابن وردان بالكسر من غير صلة.","هاء الكناية"],["يبدل أبو جعفر الهمز الساكن حرف مد مجانسًا لما قبله، سواء كان فاءً أو عينًا أو لامًا للكلمة.",true,"يبدل كل همز ساكن، ويستثنى «أنبئهم» في البقرة و«نبئهم» في الحجر والقمر.","الهمز المفرد"],["يبدل أبو جعفر الهمزة في «أنبئهم» في سورة البقرة.",false,"هي من المستثنيات، فيحققها.","الهمز المفرد"],["يبدل أبو جعفر «رؤيا» ثم يدغم، معرّفة كانت أو منكّرة.",true,"نحو: «الرؤيا» و«رؤياك»، أبدل الهمزة واوًا ثم أدغمها.","الهمز المفرد"],["يبدل ابن وردان الهمزة في «يؤيد»، ويحققها ابن جماز.",false,"العكس: أبدلها ابن جماز، وحققها ابن وردان.","الهمز المفرد"],["يقرأ أبو جعفر «مستهزءون» بحذف الهمزة ,"الهمزتان من كلمتين"],["الأولى مضمومة والثانية مفتوحة، نحو «السفهاء ألا». ما الحكم؟",["حذف الأولى","إبدال الثانية واوًا مفتوحة","إبدالها ياء","تسهيلها بين الهمزة والواو"],1,"تبدل الثانية واوًا مفتوحة.","الهمزتان من كلمتين"],["الأولى مضمومة والثانية مكسورة، نحو «يشاء إلى». ما الحكم؟",["التسهيل فقط","الإبدال واوًا مكسورة، والتسهيل بين الهمزة والياء","التحقيق","إبدال الثانية واوًا مكسورة فقط"],1,"فيها وجهان: الإبدال واوًا مكسورة، والتسهيل بين الهمزة والياء.","الهمزتان من كلمتين"],["في الاستفهام المكرر قرأ أبو جعفر بالاستفهام في الأول والإخبار في الثاني في موضعين، هما:",["المؤمنون والنمل","السجدة والنازعات","الرعد والإسراء","الواقعة والموضع الأول من الصافات"],3,"هذان الموضعان مستثنيان من أصله.","الاستفهام المكرر"],["في أي الكلمات الآتية فتح أبو جعفر ياء الإضافة كورش؟",["إخوتي (يوسف)","بيتي","معي","ولي دين"],0,"فتح «إخوتي» في يوسف كورش.","ياءات الإضافة"],["أي الموضعين أثبت فيهما أبو جعفر الياء وصلًا ووقفًا مع فتحها وصلًا؟",["آتان الله","الداع إذا دعان","ألا تتّبعنيَ (طه)، وإن يردنيَ الرحمن (يس)","يا عبادي لا خوف"],2,"أثبتها وصلًا ووقفًا مع فتحها وصلًا في طه ويس.","ياءات الزوائد"],["كيف يقرأ أبو جعفر «يا بنيّ»؟",["بالضم","بفتح الياء","بكسر الياء","بإسكان الياء"],2,"يقرؤها بكسر الياء.","أحكام خاصة"],["في «سيء» و«سيئت» يقرأ أبو جعفر:",["بالإشمام","بالروم","بالضم الخالص","بالكسر الخالص"],0,"يقرؤها بإشمام الكسر صوت الضم.","أحكام خاصة"]],"ESSAY":[["اذكري مذهب أبي جعفر في المد المتصل والمنفصل، وفي السكت.","• المتصل: أربع حركات.\n• المنفصل: القصر حركتان.\n• السكت: لا يسكت على شيء من السكتات الواجبة لحفص (عوجًا، مرقدنا، من راق، بل ران)، ويسكت على حروف الهجاء المقطعة في أوائل السور نحو «ألف لام ميم».","المد والسكت"],["بيّني ما أدغمه أبو جعفر وما أظهره مما خالف فيه غيره، ومذهبه في النون الساكنة والتنوين عند الخاء والغين.","• أدغم الذال في التاء في «اتخذتّ» و«عذتّ»، والثاء في التاء في «لبثتّ» كيف جاء.\n• أظهر «يلهث ذلك» و«اركب معنا».\n• أدغم «تأمنّا» إدغامًا محضًا بلا روم ولا إشمام.\n• أخفى النون الساكنة والتنوين عند الخاء والغين، واستثنى فأظهر: «يكن غنيًّا»، و«المنخنقة»، و«فسينغضون».","الإدغام والإظهار"],["قارني بين ابن وردان وابن جماز في هاء الكناية في «يتقه» و«يرضه» و«أرجه».","• يتّقه: ابن وردان بإسكان الهاء، وابن جماز بكسر القاف والهاء مع الصلة.\n• يرضه: ابن وردان بضم الهاء مع الصلة، وابن جماز بإسكان الهاء.\n• أرجه: ابن وردان بكسر الهاء بلا صلة، وابن جماز بكسرها مع الصلة.\n• ويتفقان على إسكان الهاء في «يؤدّه، نؤته، نولّه، نصله».","هاء الكناية"],["اذكري أحكام الهمز المتحرك بعد متحرك عند أبي جعفر مع مثال لكل حكم.","• المفتوحة بعد ضم أو كسر تبدل حرفًا مجانسًا: «يُؤَدّه» ← «يُوَدّه»، «شانئك» ← «شانيك».\n• المضمومة بعد كسر وبعدها واو تحذف ويضم ما قبلها: «مستهزءون» ← «مستهزون».\n• المضمومة بعد فتح تحذف في ثلاثة ألفاظ: «يطئون، تطئوها، تطئوهم».\n• المكسورة بعد كسر وبعدها ياء تحذف: «الخاطئين» ← «الخاطين».\n• المفتوحة بعد فتح تحذف في «متكئًا» ← «متّكًا»، وتسهل في «أرأيت».","الهمز المفرد"],["اذكري الكلمات التي سهّل فيها أبو جعفر الهمزة في باب الهمز المفرد، مع حكم كل منها.","• أرأيت: تسهيل الهمزة الثانية حيث وردت.\n• ها أنتم: تسهيل الهمزة مع إثبات الألف بعد الهاء كقالون، ويتعين القصر.\n• إسرائيل: تسهيل الهمزة، مع التوسط (وهو المقدم) أو القصر في حرف المد.\n• كائن: تسهيل الهمزة.\n• اللائي: حذف الياء وتسهيل الهمزة كأبي عمرو.","الهمز المفرد"],["وضّحي مذهب أبي جعفر في النقل، مع ذكر ما اختص به ابن وردان.","• ردءًا: نقل الحركة إلى الدال، وإبدال التنوين ألفًا وصلًا ووقفًا: «ردًا».\n• من أجل: كسر الهمزة ونقل حركتها إلى النون: «مِنِ اجْل»، وعند البدء: «إِجْل».\n• عادًا الأولى: «عادًا لُّولى» وصلًا، وعند البدء بـ«الأولى» ثلاثة أوجه.\n• خاص بابن وردان: النقل في «الآن» حيث وقعت ومنها موضعا يونس، وله في همزة الوصل الإبدال مع الإشباع، والإبدال مع القصر، والتسهيل؛ والنقل في «ملء»: «مِلُ».","النقل"],["اذكري أحكام الهمزتين المختلفتين من كلمتين عند أبي جعفر.","• مفتوحة ثم مضمومة: تسهل الثانية بين الهمزة والواو.\n• مفتوحة ثم مكسورة: تسهل الثانية بين الهمزة والياء.\n• مكسورة ثم مفتوحة: تبدل الثانية ياء مفتوحة.\n• مضمومة ثم مفتوحة: تبدل الثانية واوًا مفتوحة.\n• مضمومة ثم مكسورة: الإبدال واوًا مكسورة، والتسهيل بين الهمزة والياء.\n• وإذا اتفقتا سهّل الثانية، موافقًا أحد وجهي ورش.","الهمزتان من كلمتين"],["ما مذهب أبي جعفر في الاستفهام المكرر؟ وما المستثنى منه؟","• يقرأ بالإخبار في الأول وبالاستفهام في الثاني، مخالفًا أصله.\n• يستثنى موضعان قرأ فيهما بالاستفهام في الأول والإخبار في الثاني: موضع الواقعة، والموضع الأول من الصافات.","الاستفهام المكرر"],["ما مذهب أبي جعفر في ياءات الإضافة؟ وما المواضع التي خالف فيها قالون؟","• يفتح ويسكن حيث فتح قالون وأسكن.\n• خالفه في ثلاثة مواضع: أسكن «ولي دين» في الكافرون، وفتح «إخوتي» في يوسف كورش، وفتح «ربي إن لي عنده» قولًا واحدًا كورش، ولقالون فيها وجهان.","ياءات الإضافة"],["عدّدي الأحكام الخاصة التي ذُكرت لأبي جعفر في آخر الأصول.","• يا أبتَ: فتح التاء وصلًا، والوقف بالهاء «يا أبه».\n• يا بنيِّ: بكسر الياء.\n• تذّكّرون: بتشديد الذال حيث وقع.\n• التقاء الساكنين في كلمتين: ضم الأول إذا كان ثالث الكلمة الثانية مضمومًا ضمًا لازمًا، نحو «مسحورنُ انظر»، والكسر فيما عدا ذلك.\n• الإشمام في «سيء» و«سيئت».\n• إسكان الهاء في «وهو، فهو، لهو، وهي، لهي، فهي».","أحكام خاصة"]]}};

function ansHTML(a){return a.split("\n").map(l=>`<p>${esc(l)}</p>`).join("")}
function score(t){const v=Object.values(res[t]);return [v.filter(x=>x).length,v.length]}
function bar(t,total){const [r,n]=score(t);return `<div class="bar"><span class="score">أجبتِ عن ${AR(n)} من ${AR(total)} — الصحيح: <b>${AR(r)}</b></span><button class="reset" data-reset="${t}">إعادة</button></div>`}
function render(){
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===cur)));
 let h="";
 if(cur==="tf"){
  h+=bar("tf",TF.length);
  TF.forEach(([q,a,ex,tag],i)=>{const r=res.tf[i];const done=r!==undefined;
   h+=`<article class="q ${done?(r?"right":"wrong")+" done":""}" data-i="${i}"><div class="qh"><span class="qn">${AR(i+1)}</span><div><div class="qt">${esc(q)}</div><div class="tag">${esc(tag)}</div></div></div>
   <div class="opts tf">${[true,false].map(v=>`<button class="opt ${done&&v===a?"correct":""} ${done&&!r&&v!==a?"picked-wrong":""}" data-v="${v}" ${done?"disabled":""}>${v?"صح ✓":"خطأ ✗"}</button>`).join("")}</div>
   <div class="fb">${done?`<b class="${r?"ok":"no"}">${r?"أحسنتِ.":"الصواب: "+(a?"صح":"خطأ")+"."}</b> ${esc(ex)}`:""}</div></article>`});
 } else if(cur==="mcq"){
  h+=bar("mcq",MCQ.length);
  MCQ.forEach(([q,opts,a,ex,tag],i)=>{const p=res.mcq[i];const done=p!==undefined;const pk=res.mcqPick&&res.mcqPick[i];
   h+=`<article class="q ${done?(p?"right":"wrong")+" done":""}" data-i="${i}"><div class="qh"><span class="qn">${AR(i+1)}</span><div><div class="qt">${esc(q)}</div><div class="tag">${esc(tag)}</div></div></div>
   <div class="opts">${opts.map((o,j)=>`<button class="opt ${done&&j===a?"correct":""} ${done&&j===pk&&j!==a?"picked-wrong":""}" data-j="${j}" ${done?"disabled":""}>${"أبجد"[j]}) ${esc(o)}</button>`).join("")}</div>
   <div class="fb">${done?`<b class="${p?"ok":"no"}">${p?"أحسنتِ.":"الصواب: ("+"أبجد"[a]+")."}</b> ${esc(ex)}`:""}</div></article>`});
 } else {
  h+=`<div class="bar"><span>أجيبي في دفترك أو في نفسك أولًا، ثم اعرضي الإجابة النموذجية.</span></div>`;
  ESSAY.forEach(([q,a,tag],i)=>{h+=`<article class="q" data-i="${i}"><div class="qh"><span class="qn">${AR(i+1)}</span><div><div class="qt">${esc(q)}</div><div class="tag">${esc(tag)}</div></div></div>
   <button class="reveal">أظهري الإجابة</button><div class="ans">${ansHTML(a)}</div></article>`});
 }
 app.innerHTML=h;
}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;cur=b.dataset.t;history.replaceState(null,"","#"+rd+"-"+cur);render();window.scrollTo(0,0)});
document.querySelector(".readers").addEventListener("click",e=>{const b=e.target.closest(".rd");if(!b||b.dataset.r===rd)return;useReader(b.dataset.r);history.replaceState(null,"","#"+rd+"-"+cur);render();});
app.addEventListener("click",e=>{
 const rs=e.target.closest("[data-reset]");if(rs){res[rs.dataset.reset]={};if(rs.dataset.reset==="mcq")res.mcqPick={};render();return}
 const card=e.target.closest(".q");if(!card)return;const i=+card.dataset.i;
 const o=e.target.closest(".opt");
 if(o&&cur==="tf"){res.tf[i]=(o.dataset.v==="true")===TF[i][1];render();scrollKeep(i)}
 else if(o&&cur==="mcq"){const j=+o.dataset.j;res.mcqPick[i]=j;res.mcq[i]=j===MCQ[i][2];render();scrollKeep(i)}
 else if(e.target.closest(".reveal")) card.classList.add("open");
});
function scrollKeep(i){const el=app.querySelector(`.q[data-i="${i}"]`);if(el&&el.getBoundingClientRect().top<60)el.scrollIntoView({block:"start"})}
const [h1,h2]=location.hash.slice(1).split("-");if(SETS[h1])rd=h1;else if(["tf","mcq","essay"].includes(h1))cur=h1;if(["tf","mcq","essay"].includes(h2))cur=h2;
useReader(rd);render();
</script>
</body>
</html>
